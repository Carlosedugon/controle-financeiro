<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<title>Minhas Finanças</title>
<style>
:root{
  --bg:#f2f3f1;--card:#ffffff;--ink:#0b0b0b;--ink2:#52514e;--muted:#85847f;--line:#e7e6e2;
  --brand:#0f766e;--brand2:#0b5c55;--brandSoft:#e3f2ef;--onBrand:#ffffff;
  --ok:#16794a;--okBg:#e6f4ec;--warn:#a85a00;--warnBg:#fcf1df;--bad:#c62828;--badBg:#fbe9e9;--info:#2a78d6;--infoBg:#e8f0fb;
  --s1:#2a78d6;--s2:#eb6834;--grid:#e7e6e2;--shadow:0 1px 2px rgba(0,0,0,.05),0 2px 8px rgba(0,0,0,.04);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:where(:not([data-theme="light"])){
    --bg:#111312;--card:#1b1d1c;--ink:#f0efec;--ink2:#c3c2b7;--muted:#8f8e86;--line:#2b2e2c;
    --brand:#0f766e;--brand2:#0b5c55;--brandSoft:#15302c;
    --ok:#4cc38a;--okBg:#173326;--warn:#f0a646;--warnBg:#382a14;--bad:#f07070;--badBg:#3a1c1c;--info:#6aa7f0;--infoBg:#18283d;
    --s1:#3987e5;--s2:#d95926;--grid:#2b2e2c;--shadow:none;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#111312;--card:#1b1d1c;--ink:#f0efec;--ink2:#c3c2b7;--muted:#8f8e86;--line:#2b2e2c;
  --brand:#0f766e;--brand2:#0b5c55;--brandSoft:#15302c;
  --ok:#4cc38a;--okBg:#173326;--warn:#f0a646;--warnBg:#382a14;--bad:#f07070;--badBg:#3a1c1c;--info:#6aa7f0;--infoBg:#18283d;
  --s1:#3987e5;--s2:#d95926;--grid:#2b2e2c;--shadow:none;color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.35;padding-bottom:88px;overscroll-behavior-y:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,select,textarea{font:inherit;color:var(--ink)}
.num{font-variant-numeric:tabular-nums}

/* Header */
#top{position:sticky;top:0;z-index:20;background:var(--brand);color:var(--onBrand);padding:10px 12px;display:flex;align-items:center;gap:6px;min-height:56px}
#top .ttl{font-weight:650;font-size:17px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ibtn{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;flex:none}
.ibtn:active{background:rgba(255,255,255,.15)}
.ibtn svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.mpick{display:flex;align-items:center;background:rgba(255,255,255,.14);border-radius:20px;height:34px}
.mpick button{height:34px;padding:0 9px;font-size:14px}
.mpick .lbl{font-weight:600;min-width:84px;text-align:center}

/* Hero */
.hero{background:linear-gradient(var(--brand),var(--brand2));color:var(--onBrand);padding:6px 18px 22px;border-radius:0 0 22px 22px}
.hero small{opacity:.85;font-size:13px}
.hero .big{font-size:30px;font-weight:700;letter-spacing:-.5px;margin:2px 0 10px}
.hero .hrow{display:flex;gap:10px}
.hero .pill{flex:1;background:rgba(255,255,255,.13);border-radius:14px;padding:9px 12px}
.hero .pill b{display:block;font-size:15px;margin-top:2px}

main{padding:12px 12px 8px;max-width:760px;margin:0 auto}
.card{background:var(--card);border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:var(--shadow)}
.card h3{margin:0 0 10px;font-size:15px;font-weight:650;display:flex;align-items:center;gap:8px}
.card h3 .sp{flex:1}
.card h3 .lnk{font-size:13px;font-weight:600;color:var(--brand)}
[data-theme="dark"] .card h3 .lnk{color:#5cc7b6}
.muted{color:var(--muted)} .ink2{color:var(--ink2)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.kpi{background:var(--card);border-radius:16px;padding:12px;box-shadow:var(--shadow)}
.kpi span{font-size:12.5px;color:var(--ink2);display:flex;align-items:center;gap:6px}
.kpi b{display:block;font-size:17px;margin-top:4px;font-weight:650}
.kpi i{font-style:normal;font-size:12px;color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin-top:8px}
.bar>div{height:100%;border-radius:4px;background:var(--brand)}
.bar.lg{height:12px;border-radius:6px}
.alert{display:flex;gap:10px;align-items:center;border-radius:14px;padding:11px 13px;margin-bottom:12px;font-size:14px}
.alert.bad{background:var(--badBg);color:var(--bad)} .alert.warn{background:var(--warnBg);color:var(--warn)}
.alert b{font-weight:650}

/* List rows */
.row{display:flex;align-items:center;gap:11px;padding:10px 0;border-top:1px solid var(--line)}
.list .row:first-child{border-top:0}
.row .ic{width:38px;height:38px;border-radius:12px;background:var(--brandSoft);display:grid;place-items:center;font-size:18px;flex:none}
.row .tx{flex:1;min-width:0}
.row .tx b{display:block;font-weight:600;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .tx small{display:block;color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .vl{text-align:right;flex:none}
.row .vl b{display:block;font-weight:650;font-size:14.5px}
.row.tap:active{opacity:.6}
.chip{display:inline-block;font-size:11px;font-weight:650;padding:2px 7px;border-radius:9px;margin-top:3px}
.chip.ok{background:var(--okBg);color:var(--ok)} .chip.warn{background:var(--warnBg);color:var(--warn)}
.chip.bad{background:var(--badBg);color:var(--bad)} .chip.info{background:var(--infoBg);color:var(--info)}
.chip.mut{background:var(--line);color:var(--ink2)}
.pos{color:var(--ok)} .neg{color:var(--bad)}
.chk{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;flex:none;color:var(--muted)}
.chk svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2.6}
.chk.on{background:var(--ok);border-color:var(--ok);color:#fff}
.empty{text-align:center;color:var(--muted);padding:22px 10px;font-size:14px}
.sec{font-size:12.5px;font-weight:650;color:var(--ink2);text-transform:uppercase;letter-spacing:.4px;margin:16px 4px 8px}

/* Segments & buttons */
.seg{display:flex;background:var(--line);border-radius:12px;padding:3px;gap:3px;margin-bottom:12px}
.seg button{flex:1;padding:8px 6px;border-radius:9px;font-size:14px;font-weight:600;color:var(--ink2)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:44px;padding:0 16px;border-radius:12px;font-weight:650;background:var(--brand);color:#fff}
.btn.sec2{background:var(--brandSoft);color:var(--brand)}
[data-theme="dark"] .btn.sec2{color:#5cc7b6}
.btn.danger{background:var(--badBg);color:var(--bad)}
.btn.full{width:100%}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btns .btn{flex:1}
.mini{font-size:13px;font-weight:650;color:var(--brand);padding:6px 2px}

/* Category bars */
.cb{padding:8px 0;border-top:1px solid var(--line)}
.cb:first-child{border-top:0}
.cb .h{display:flex;align-items:center;gap:8px;font-size:14px}
.cb .h .n{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cb .h .p{color:var(--muted);font-size:12px;width:38px;text-align:right}
.cb .bar{height:6px;margin-top:6px}
.cb .bar>div{background:var(--s1)}
.cb .subs{margin:6px 0 2px 26px}
.cb .subs .h{font-size:13px;color:var(--ink2);padding:3px 0}
.cb .arr{font-size:11px;color:var(--muted);width:12px}

/* Charts */
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--card);font-size:12.5px;padding:7px 9px;border-radius:9px;white-space:nowrap;transform:translate(-50%,-100%);opacity:0;transition:opacity .12s;z-index:3}
.chart .tip.on{opacity:1}
.legend{display:flex;gap:14px;font-size:12.5px;color:var(--ink2);margin-bottom:8px;flex-wrap:wrap}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.tbl{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}
.tbl td,.tbl th{padding:6px 4px;border-top:1px solid var(--line);text-align:right}
.tbl th{font-weight:600;color:var(--ink2)} .tbl td:first-child,.tbl th:first-child{text-align:left}

/* Calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal .wd{font-size:11px;color:var(--muted);font-weight:600;padding-bottom:2px}
.cal .d{aspect-ratio:1/1;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:13.5px;gap:3px}
.cal .d.today{outline:2px solid var(--brand)}
.cal .d.sel{background:var(--brand);color:#fff}
.cal .d .ds{display:flex;gap:2px;height:6px}
.cal .d .ds i{width:5px;height:5px;border-radius:50%}

/* Credit card visual */
.cc{border-radius:18px;padding:16px;color:#fff;margin-bottom:12px;position:relative;overflow:hidden}
.cc .nm{font-weight:700;font-size:16px}
.cc small{opacity:.85}
.cc .lim{display:flex;justify-content:space-between;margin-top:18px;font-size:13px}
.cc .bar{background:rgba(255,255,255,.25)} .cc .bar>div{background:#fff}

/* Nav */
#nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);display:flex;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
#nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--muted);padding:4px 0}
#nav button svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
#nav button.on{color:var(--brand)}
[data-theme="dark"] #nav button.on{color:#5cc7b6}
#fab{position:fixed;right:16px;bottom:78px;z-index:21;width:56px;height:56px;border-radius:18px;background:var(--brand);color:#fff;font-size:30px;font-weight:300;box-shadow:0 4px 14px rgba(15,118,110,.4);display:grid;place-items:center}
#fab.hide{display:none}

/* Sheet */
#sheet{position:fixed;inset:0;z-index:50;display:none}
#sheet.on{display:block}
#sheet .scrim{position:absolute;inset:0;background:rgba(0,0,0,.45)}
#sheetBox{position:absolute;left:0;right:0;bottom:0;max-height:92vh;overflow:auto;background:var(--card);border-radius:20px 20px 0 0;padding:0 16px calc(18px + env(safe-area-inset-bottom));max-width:760px;margin:0 auto}
.sh-head{position:sticky;top:0;background:var(--card);display:flex;align-items:center;padding:16px 0 10px;z-index:2}
.sh-head b{flex:1;font-size:17px}
.sh-head button{width:34px;height:34px;border-radius:50%;background:var(--line);font-size:15px}
.fl{display:block;margin-bottom:12px}
.fl>span{display:block;font-size:12.5px;font-weight:600;color:var(--ink2);margin-bottom:5px}
.fl input,.fl select,.fl textarea{width:100%;height:46px;border:1.5px solid var(--line);border-radius:12px;padding:0 12px;background:var(--bg);outline:none}
.fl textarea{height:72px;padding:10px 12px;resize:vertical}
.fl input:focus,.fl select:focus,.fl textarea:focus{border-color:var(--brand)}
.fl .seg{margin:0}
.fl.ck{display:flex;align-items:center;gap:10px;font-size:14px}
.fl.ck input{width:22px;height:22px;accent-color:var(--brand);flex:none}
.hint{font-size:12.5px;color:var(--ink2);background:var(--brandSoft);border-radius:10px;padding:9px 11px;margin-bottom:12px}
.subed{display:flex;gap:6px;margin-bottom:6px}
.subed input{flex:1;height:40px;border:1.5px solid var(--line);border-radius:10px;padding:0 10px;background:var(--bg)}
.subed button{width:40px;height:40px;border-radius:10px;background:var(--badBg);color:var(--bad);font-size:16px}
.mgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0 14px}
.mgrid button{height:44px;border-radius:12px;background:var(--bg);font-weight:600}
.mgrid button.on{background:var(--brand);color:#fff}
.colors{display:flex;gap:10px;flex-wrap:wrap}
.colors button{width:34px;height:34px;border-radius:50%;border:3px solid transparent}
.colors button.on{border-color:var(--ink)}
.menu .row{padding:13px 0}
.menu .row .ic{font-size:19px}

#toast{position:fixed;left:50%;bottom:150px;transform:translateX(-50%);background:var(--ink);color:var(--card);padding:10px 16px;border-radius:12px;font-size:14px;z-index:60;opacity:0;pointer-events:none;transition:opacity .2s;max-width:88vw;text-align:center}
#toast.on{opacity:1}
.ring{display:flex;align-items:center;gap:16px}
.ring svg{width:96px;height:96px;flex:none}
.stat{display:flex;justify-content:space-between;padding:7px 0;border-top:1px solid var(--line);font-size:14px}
.stat:first-of-type{border-top:0}
.search{width:100%;height:42px;border:1.5px solid var(--line);border-radius:12px;padding:0 12px;background:var(--card);margin-bottom:10px;outline:none}
</style>
</head>
<body>
<header id="top"></header>
<div id="heroSlot"></div>
<main id="view"></main>
<button id="fab" data-act="fab" aria-label="Novo lançamento">+</button>
<nav id="nav"></nav>
<div id="sheet"><div class="scrim" data-act="closeSheet"></div><div id="sheetBox"></div></div>
<div id="toast"></div>
<input type="file" id="fileIn" accept="application/json,.json,text/plain" hidden>

<script>
'use strict';
/* =========================================================
   Utilidades
   ========================================================= */
const $ = s => document.querySelector(s);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const BRL = new Intl.NumberFormat('pt-BR', {style: 'currency', currency: 'BRL'});
const pad = n => String(n).padStart(2, '0');
const r2 = n => Math.round((n + Number.EPSILON) * 100) / 100;
const sum = (a, f) => r2(a.reduce((s, x) => s + (typeof f === 'function' ? f(x) : (+x[f] || 0)), 0));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
const slug = s => s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '');
const MESES = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const MES3 = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];

function money(v, force) { return (S.cfg.ocultar && !force) ? 'R$ ••••' : BRL.format(v || 0); }
function moneyC(v) { // compacto para eixos
  if (S.cfg.ocultar) return '•••';
  const a = Math.abs(v);
  if (a >= 1e6) return (v / 1e6).toFixed(1).replace('.', ',') + ' mi';
  if (a >= 1e3) return (v / 1e3).toFixed(a >= 1e4 ? 0 : 1).replace('.', ',') + ' mil';
  return String(Math.round(v));
}
function pm(s) {
  if (typeof s === 'number') return r2(s);
  s = String(s || '').trim().replace(/[R$\s]/g, '');
  if (s.includes(',')) s = s.replace(/\./g, '').replace(',', '.');
  const n = parseFloat(s);
  return isNaN(n) ? 0 : r2(n);
}
function pn(s, int) {
  if (typeof s === 'number') return s;
  s = String(s ?? '').trim(); if (!s) return '';
  if (int) s = s.replace(/[.,\s]/g, ''); else if (s.includes(',')) s = s.replace(/\./g, '').replace(',', '.');
  const n = parseFloat(s); return isNaN(n) ? '' : n;
}
const mfmt = v => typeof v === 'string' ? v : (typeof v === 'number' && !isNaN(v) ? String(r2(v)).replace('.', ',') : '');
function today() { const d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
const ymOf = s => (s || '').slice(0, 7);
function addMonthsYM(ym, n) { let [y, m] = ym.split('-').map(Number); m += n; y += Math.floor((m - 1) / 12); m = ((m - 1) % 12 + 12) % 12 + 1; return y + '-' + pad(m); }
const daysIn = (y, m) => new Date(y, m, 0).getDate();
function dateIn(ym, day) { const [y, m] = ym.split('-').map(Number); return ym + '-' + pad(Math.min(Math.max(1, day), daysIn(y, m))); }
function addDays(s, n) { const d = new Date(s + 'T12:00:00'); d.setDate(d.getDate() + n); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
const addMonthsDate = (s, n) => dateIn(addMonthsYM(ymOf(s), n), +s.slice(8, 10));
const endOfYM = ym => dateIn(ym, 31);
const fmtD = s => s ? s.slice(8, 10) + '/' + s.slice(5, 7) + '/' + s.slice(0, 4) : '';
const fmtDs = s => s ? s.slice(8, 10) + '/' + s.slice(5, 7) : '';
const ymLabel = ym => MESES[+ym.slice(5, 7) - 1] + ' ' + ym.slice(0, 4);
const ymShort = ym => MES3[+ym.slice(5, 7) - 1] + '/' + ym.slice(2, 4);
function diffDays(a, b) { return Math.round((new Date(b + 'T12:00:00') - new Date(a + 'T12:00:00')) / 864e5); }
function monthsBetween(a, b) { const [y1, m1] = a.split('-').map(Number), [y2, m2] = b.split('-').map(Number); return (y2 - y1) * 12 + (m2 - m1); }

function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('on'), 2200); }

/* =========================================================
   Dados
   ========================================================= */
const KEY = 'minhas_financas_v1';
const GRUPOS_D = ['Essenciais', 'Carro', 'Pessoais', 'Financeiras', 'Outras'];

const CAT_SEED = [
  // Receitas
  ['r', 'Receitas', '💼', 'Salário'],
  ['r', 'Receitas', '➕', 'Renda extra'],
  ['r', 'Receitas', '🤝', 'Comissões'],
  ['r', 'Receitas', '💻', 'Freelance'],
  ['r', 'Receitas', '💰', 'Outras receitas'],
  // Essenciais
  ['d', 'Essenciais', '🏠', 'Moradia', ['Aluguel', 'Condomínio', 'IPTU', 'Manutenção da casa']],
  ['d', 'Essenciais', '💧', 'Água'],
  ['d', 'Essenciais', '⚡', 'Energia elétrica'],
  ['d', 'Essenciais', '📶', 'Internet'],
  ['d', 'Essenciais', '🍽️', 'Alimentação'],
  ['d', 'Essenciais', '🛒', 'Supermercado'],
  ['d', 'Essenciais', '🚌', 'Transporte', ['Ônibus', 'Aplicativo / Táxi', 'Moto-táxi']],
  ['d', 'Essenciais', '🩺', 'Saúde', ['Plano de saúde', 'Consultas', 'Farmácia', 'Exames']],
  ['d', 'Essenciais', '🎓', 'Educação', ['Mensalidade', 'Cursos', 'Material escolar']],
  // Carro
  ['d', 'Carro', '🚗', 'Carro', ['Combustível', 'Manutenção / Revisão', 'Troca de óleo', 'Pneus', 'Seguro', 'IPVA', 'Licenciamento', 'Multas', 'Estacionamento', 'Pedágio', 'Lavagem', 'Peças e acessórios', 'Parcela do financiamento', 'Documentação / Despachante'], true],
  // Pessoais
  ['d', 'Pessoais', '🎉', 'Lazer'],
  ['d', 'Pessoais', '🍔', 'Restaurantes'],
  ['d', 'Pessoais', '👕', 'Vestuário'],
  ['d', 'Pessoais', '📺', 'Assinaturas', ['Streaming', 'Celular', 'Aplicativos']],
  ['d', 'Pessoais', '🛍️', 'Compras'],
  ['d', 'Pessoais', '💇', 'Cuidados pessoais'],
  // Financeiras
  ['d', 'Financeiras', '💳', 'Cartão de crédito'],
  ['d', 'Financeiras', '🏦', 'Empréstimos'],
  ['d', 'Financeiras', '🏡', 'Financiamentos'],
  ['d', 'Financeiras', '📈', 'Juros'],
  ['d', 'Financeiras', '🧾', 'Tarifas bancárias'],
  ['d', 'Financeiras', '🔢', 'Parcelamentos'],
  ['d', 'Outras', '📦', 'Outras despesas'],
];
function buildCats() {
  return CAT_SEED.map(([tipo, grupo, ic, nome, subs, veiculo]) => {
    const id = slug(nome);
    return {id, tipo, grupo, ic, nome, veiculo: !!veiculo, subs: (subs || []).map(s => ({id: id + '-' + slug(s), nome: s}))};
  });
}
function seed() {
  return {
    v: 1,

function normalize(d) {

  d.cfg = Object.assign(b.cfg, d.cfg || {});
  d.reserva = Object.assign(b.reserva, d.reserva || {});
  if (!d.cfg.veiculos || !d.cfg.veiculos.length) d.cfg.veiculos = b.cfg.veiculos;

}

const catById = id => S.cats.find(c => c.id === id);

   ========================================================= */
function stDesp(d) { if (d.status === 'pago') return 'pago'; return d.data < today() ? 'atrasado' : 'pendente'; }
function stRec(r) { if (r.status === 'recebida') return 'recebida'; return r.data < today() ? 'atrasada' : 'prevista'; }

// Recorrência: ao pagar/receber, cria a próxima ocorrência pendente
function nextDate(data, rec) {
  if (rec === 'semanal') return addDays(data, 7);
  if (rec === 'mensal') return addMonthsDate(data, 1);
  if (rec === 'anual') return addMonthsDate(data, 12);
  return null;
}
function gerarProxima(item, lista, campoStatus, pendente) {
  if (!item.rec || item.rec === 'unica' || item.proxGerada) return;
  const nd = nextDate(item.data, item.rec); if (!nd) return;
  const novo = Object.assign({}, item, {id: uid(), data: nd, proxGerada: false});
  novo[campoStatus] = pendente; delete novo.pagoEm; delete novo.recEm;
  item.proxGerada = true;
  lista.push(novo);
}
function marcarPago(d) {
  d.status = 'pago'; d.pagoEm = d.data <= today() ? d.data : today();
  gerarProxima(d, S.despesas, 'status', 'pendente');
}
function marcarRecebida(r) {
  r.status = 'recebida'; r.recEm = r.data <= today() ? r.data : today();
  gerarProxima(r, S.receitas, 'status', 'pendente');
}

// Cartões — mês de vencimento da fatura para uma compra
function invoiceYM(card, data) {
  let ym = ymOf(data);
  if (+data.slice(8, 10) > card.fech) ym = addMonthsYM(ym, 1);   // depois do fechamento -> próxima fatura
  if (card.venc <= card.fech) ym = addMonthsYM(ym, 1);           // vence no mês seguinte ao fechamento
  return ym;
}
function cardInstallments() {
  const out = [];
  for (const c of S.compras) {
    const card = S.cartoes.find(x => x.id === c.cartao); if (!card) continue;
    const first = invoiceYM(card, c.data), n = Math.max(1, c.parcelas | 0);
    const base = Math.floor(c.valor * 100 / n) / 100;
    for (let i = 0; i < n; i++) {
      const v = i === n - 1 ? r2(c.valor - base * (n - 1)) : base;
      out.push({compra: c, card, i, n, valor: v, ym: addMonthsYM(first, i)});
    }
  }
  return out;
}
function fatura(card, ym, inst) {
  const items = (inst || cardInstallments()).filter(x => x.card.id === card.id && x.ym === ym);
  const total = sum(items, 'valor');
  const pagos = S.faturasPg.filter(p => p.cartao === card.id && p.ym === ym);
  const pago = sum(pagos, 'valor');
  const closeYM = card.venc <= card.fech ? addMonthsYM(ym, -1) : ym;
  const fechamento = dateIn(closeYM, card.fech), vencimento = dateIn(ym, card.venc);
  let st;
  if (total <= 0) st = 'vazia';
  else if (pago >= total - 0.005) st = 'paga';
  else if (today() <= fechamento) st = 'aberta';
  else if (today() > vencimento) st = 'atrasada';
  else st = 'fechada';
  return {items, total, pago, restante: r2(Math.max(0, total - pago)), pagos, fechamento, vencimento, st};
}
function cardUsado(card, inst) {
  inst = inst || cardInstallments();
  const yms = [...new Set(inst.filter(x => x.card.id === card.id).map(x => x.ym))];
  return r2(yms.reduce((s, ym) => s + fatura(card, ym, inst).restante, 0));
}

// Empréstimos tomados
function loanTotal(l) { return l.valorTotal > 0 ? l.valorTotal : r2(l.valorParc * l.nParc); }
function loanInfo(l) {
  const pago = sum(l.pagos, 'valor'), total = loanTotal(l);
  const parcPagas = l.valorParc > 0 ? Math.min(l.nParc, Math.floor((pago + 0.005) / l.valorParc)) : 0;
  const saldo = r2(Math.max(0, total - pago)), rest = Math.max(0, l.nParc - parcPagas);
  const prox = rest > 0 && saldo > 0 ? addMonthsDate(l.primeiroVenc, parcPagas) : null;
  return {pago, total, parcPagas, saldo, rest, prox, quitado: saldo <= 0.005};
}
function loanInstallmentsInMonth(ym) {
  const out = [];
  for (const l of S.tomados) {
    const inf = loanInfo(l);
    for (let i = 0; i < l.nParc; i++) {
      const dt = addMonthsDate(l.primeiroVenc, i);
      if (ymOf(dt) === ym) out.push({loan: l, i, data: dt, valor: l.valorParc, pago: i < inf.parcPagas || inf.quitado});
    }
  }
  return out;
}
// Empréstimos concedidos
function concInfo(c) {
  const rec = sum(c.recebs, 'valor'), saldo = r2(Math.max(0, c.valor - rec));
  let st = saldo <= 0.005 ? 'quitado' : (c.previsao && c.previsao < today() ? 'atrasado' : (rec > 0 ? 'parcial' : 'aberto'));
  return {rec, saldo, st};
}

// Saldos em uma data
function balanceAt(D) {
  let s = +S.cfg.saldoInicial || 0;
  for (const r of S.receitas) if (r.status === 'recebida' && (r.recEm || r.data) <= D) s += r.valor;
  for (const d of S.despesas) if (d.status === 'pago' && (d.pagoEm || d.data) <= D) s -= d.valor;
  for (const p of S.faturasPg) if (p.data <= D) s -= p.valor;
  for (const l of S.tomados) { if (l.creditar && l.dataContr <= D) s += l.valorOriginal; for (const p of l.pagos) if (p.data <= D) s -= p.valor; }
  for (const c of S.concedidos) { if (c.descontar !== false && c.data <= D) s -= c.valor; for (const p of c.recebs) if (p.data <= D) s += p.valor; }
  for (const m of S.reserva.movs) if (m.data <= D) s += m.tipo === 'ret' ? m.valor : -m.valor;
  for (const o of S.objetivos) for (const a of o.aportes) if (a.data <= D) s -= a.valor;
  return r2(s);
}
const reservaAt = D => sum(S.reserva.movs.filter(m => m.data <= D), m => m.tipo === 'ret' ? -m.valor : m.valor);
const objetivosAt = D => sum(S.objetivos.flatMap(o => o.aportes).filter(a => a.data <= D), 'valor');
const aReceberAt = D => sum(S.concedidos.filter(c => c.data <= D), c => Math.max(0, c.valor - sum(c.recebs.filter(p => p.data <= D), 'valor')));
const loanDebtAt = D => sum(S.tomados.filter(l => l.dataContr <= D), l => Math.max(0, loanTotal(l) - sum(l.pagos.filter(p => p.data <= D), 'valor')));
function cardDebtAt(D, inst) {
  inst = inst || cardInstallments();
  return sum(S.cartoes, c => Math.max(0, sum(inst.filter(x => x.card.id === c.id && x.compra.data <= D), 'valor') - sum(S.faturasPg.filter(p => p.cartao === c.id && p.data <= D), 'valor')));
}
function patrimonioAt(D, inst) { return r2(balanceAt(D) + reservaAt(D) + objetivosAt(D) + aReceberAt(D) - loanDebtAt(D) - cardDebtAt(D, inst)); }
function reservaMeta() { const r = S.reserva; return r.metaManual > 0 ? r.metaManual : r2((r.custoMensal || 0) * (r.meses || 6)); }

function monthData(ym, inst) {
  inst = inst || cardInstallments();
  const rec = S.receitas.filter(r => ymOf(r.data) === ym);
  const desp = S.despesas.filter(d => ymOf(d.data) === ym);
  const ci = inst.filter(x => x.ym === ym);
  const li = loanInstallmentsInMonth(ym);
  const totRec = sum(rec, 'valor'), recebido = sum(rec.filter(r => r.status === 'recebida'), 'valor');
  const totDespAv = sum(desp, 'valor'), totCard = sum(ci, 'valor'), totLoan = sum(li, 'valor');
  const totDesp = r2(totDespAv + totCard + totLoan);
  const pagoAv = sum(desp.filter(d => d.status === 'pago'), 'valor');
  return {rec, desp, ci, li, totRec, recebido, totDespAv, totCard, totLoan, totDesp, pagoAv};
}
function catBreakdown(md) {
  const map = {};
  const add = (cat, sub, v) => { const k = cat || '_'; map[k] = map[k] || {id: k, total: 0, subs: {}}; map[k].total += v; const s = sub || '_'; map[k].subs[s] = (map[k].subs[s] || 0) + v; };
  md.desp.forEach(d => add(d.cat, d.sub, d.valor));
  md.ci.forEach(x => add(x.compra.cat, x.compra.sub, x.valor));
  md.li.forEach(x => add('emprestimos', '', x.valor));
  return Object.values(map).map(o => ({...o, total: r2(o.total)})).sort((a, b) => b.total - a.total);
}

/* Eventos da agenda num mês */
function agendaEvents(ym, inst) {
  inst = inst || cardInstallments();
  const ev = [];
  S.despesas.filter(d => ymOf(d.data) === ym).forEach(d => {
    const st = stDesp(d);
    ev.push({data: d.data, tipo: 'desp', ic: catIc(d.cat), t: d.desc, s: catFull(d.cat, d.sub), v: -d.valor, st, ref: d.id});
  });
  S.receitas.filter(r => ymOf(r.data) === ym).forEach(r => {
    const st = stRec(r);
    ev.push({data: r.data, tipo: 'rec', ic: catIc(r.cat), t: r.desc, s: catLabel(r.cat), v: r.valor, st, ref: r.id});
  });
  S.cartoes.forEach(c => {
    const f = fatura(c, ym, inst); if (f.total <= 0) return;
    const st = f.st === 'paga' ? 'pago' : (f.st === 'atrasada' ? 'atrasado' : 'pendente');
    ev.push({data: f.vencimento, tipo: 'fat', ic: '💳', t: 'Fatura ' + c.nome, s: 'Cartão de crédito', v: -f.total, st, ref: c.id});
  });
  loanInstallmentsInMonth(ym).forEach(x => {
    const st = x.pago ? 'pago' : (x.data < today() ? 'atrasado' : 'pendente');
    ev.push({data: x.data, tipo: 'emp', ic: '🏦', t: x.loan.credor + ' — parcela ' + (x.i + 1) + '/' + x.loan.nParc, s: 'Empréstimo', v: -x.valor, st, ref: x.loan.id});
  });
  S.concedidos.forEach(c => {
    if (!c.previsao || ymOf(c.previsao) !== ym) return;
    const inf = concInfo(c);
    ev.push({data: c.previsao, tipo: 'conc', ic: '🤝', t: 'Devolução — ' + c.pessoa, s: 'Empréstimo concedido', v: inf.saldo > 0 ? inf.saldo : c.valor, st: inf.st === 'quitado' ? 'recebida' : (c.previsao < today() ? 'atrasada' : 'prevista'), ref: c.id});
  });
  return ev.sort((a, b) => a.data.localeCompare(b.data));
}
function allOverdue(inst) {
  const t = today(), out = [];
  S.despesas.forEach(d => { if (d.status !== 'pago' && d.data < t) out.push({data: d.data, tipo: 'desp', ic: catIc(d.cat), t: d.desc, s: catFull(d.cat, d.sub), v: -d.valor, st: 'atrasado', ref: d.id}); });
  S.cartoes.forEach(c => {
    const yms = [...new Set(inst.filter(x => x.card.id === c.id).map(x => x.ym))];
    yms.forEach(ym => { const f = fatura(c, ym, inst); if (f.st === 'atrasada') out.push({data: f.vencimento, tipo: 'fat', ic: '💳', t: 'Fatura ' + c.nome + ' (' + ymShort(ym) + ')', s: 'Restante a pagar', v: -f.restante, st: 'atrasado', ref: c.id}); });
  });
  S.tomados.forEach(l => { const inf = loanInfo(l); if (inf.prox && inf.prox < t) out.push({data: inf.prox, tipo: 'emp', ic: '🏦', t: l.credor + ' — parcela ' + (inf.parcPagas + 1) + '/' + l.nParc, s: 'Empréstimo', v: -l.valorParc, st: 'atrasado', ref: l.id}); });
  return out.sort((a, b) => a.data.localeCompare(b.data));
}
function upcoming(days, inst) {

    series.forEach((s, j) => {
      const v = s.vals[i], h = max ? ih * v / max : 0, x = cx - tot / 2 + j * (bw + 2), y = T + ih - h;
      if (h > 0) g += `<path d="M${x},${T + ih} V${y + Math.min(4, h)} q0,-${Math.min(4, h)} ${Math.min(4, bw / 2)},-${Math.min(4, h)} H${x + bw - Math.min(4, bw / 2)} q${Math.min(4, bw / 2)},0 ${Math.min(4, bw / 2)},${Math.min(4, h)} V${T + ih} Z" fill="${s.cor}"/>`;
    });
    g += `<text x="${cx}" y="${H - 7}" text-anchor="middle" font-size="10.5" fill="var(--ink2)">${lb}</text>`;
    g += `<rect x="${gx}" y="${T}" width="${gw}" height="${ih + B}" fill="transparent" data-tip="${id}" data-i="${i}" data-x="${cx / W}" data-y="${T / H}"/>`;
    tips.push(`<b>${lb}</b><br>` + series.map(s => `${s.nome}: ${money(s.vals[i])}`).join('<br>'));
  });
  TIPS[id] = tips;
  return `<div class="chart" id="${id}"><svg viewBox="0 0 ${W} ${H}">${g}</svg><div class="tip"></div></div>`;
}
function lineChart(id, labels, vals, cor) {
  const W = 340, H = 170, L = 44, R = 10, T = 12, B = 24, iw = W - L - R, ih = H - T - B;
  let mn = Math.min(...vals, 0), mx = Math.max(...vals, 0);
  mx = niceMax(mx > 0 ? mx : 1); if (mn < 0) mn = -niceMax(-mn);
  const yOf = v => T + ih - ih * (v - mn) / ((mx - mn) || 1);
  const xOf = i => L + (labels.length === 1 ? iw / 2 : iw * i / (labels.length - 1));
  let g = '';
  for (let k = 0; k <= 4; k++) { const v = mn + (mx - mn) * k / 4, y = yOf(v); g += `<line x1="${L}" x2="${W - R}" y1="${y}" y2="${y}" stroke="var(--grid)"/><text x="${L - 6}" y="${y + 3.5}" text-anchor="end" font-size="10" fill="var(--muted)">${moneyC(v)}</text>`; }
  if (mn < 0) g += `<line x1="${L}" x2="${W - R}" y1="${yOf(0)}" y2="${yOf(0)}" stroke="var(--muted)" stroke-dasharray="3 3"/>`;
  g += `<polyline fill="none" stroke="${cor}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" points="${vals.map((v, i) => xOf(i) + ',' + yOf(v)).join(' ')}"/>`;
  vals.forEach((v, i) => g += `<circle cx="${xOf(i)}" cy="${yOf(v)}" r="4" fill="${cor}" stroke="var(--card)" stroke-width="2"/>`);
  const step = iw / Math.max(1, labels.length - 1), tips = [];
  labels.forEach((lb, i) => {
    g += `<text x="${xOf(i)}" y="${H - 7}" text-anchor="middle" font-size="10.5" fill="var(--ink2)">${lb}</text>`;
    g += `<rect x="${xOf(i) - step / 2}" y="${T}" width="${step}" height="${ih + B}" fill="transparent" data-tip="${id}" data-i="${i}" data-x="${xOf(i) / W}" data-y="${yOf(vals[i]) / H}"/>`;
    tips.push(`<b>${lb}</b><br>Patrimônio: ${money(vals[i])}`);
  });
  TIPS[id] = tips;
  return `<div class="chart" id="${id}"><svg viewBox="0 0 ${W} ${H}">${g}</svg><div class="tip"></div></div>`;
}
function showTip(el) {
  const ch = document.getElementById(el.dataset.tip); if (!ch) return;
  const tip = ch.querySelector('.tip'), w = ch.clientWidth, h = ch.clientHeight;
  tip.innerHTML = TIPS[el.dataset.tip][+el.dataset.i];
  let x = +el.dataset.x * w; x = Math.max(70, Math.min(w - 70, x));
  tip.style.left = x + 'px'; tip.style.top = Math.max(40, +el.dataset.y * h) + 'px';
  tip.classList.add('on');
  clearTimeout(showTip._t); showTip._t = setTimeout(() => tip.classList.remove('on'), 2600);
}

/* Agenda */
VIEWS.agenda = function () {
  const inst = cardInstallments(), ev = agendaEvents(M, inst), t = today();
  const [y, m] = M.split('-').map(Number), first = new Date(y, m - 1, 1).getDay(), nd = daysIn(y, m);
  const byDay = {};
  ev.forEach(e => (byDay[+e.data.slice(8, 10)] = byDay[+e.data.slice(8, 10)] || []).push(e));
  const col = st => ({pago: 'var(--ok)', recebida: 'var(--ok)', atrasado: 'var(--bad)', atrasada: 'var(--bad)', pendente: 'var(--warn)', prevista: 'var(--info)'}[st] || 'var(--muted)');
  let cal = ['D', 'S', 'T', 'Q', 'Q', 'S', 'S'].map(d => `<div class="wd">${d}</div>`).join('') + '<div></div>'.repeat(first);
  for (let d = 1; d <= nd; d++) {
    const ds = M + '-' + pad(d), es = byDay[d] || [];
    const sts = [...new Set(es.map(e => col(e.st)))].slice(0, 3);
    cal += `<button class="d ${ds === t ? 'today' : ''} ${UI.agDia === ds ? 'sel' : ''}" data-act="agDia" data-v="${ds}">${d}<span class="ds">${sts.map(c => `<i style="background:${c}"></i>`).join('')}</span></button>`;
  }
  let h = `<div class="card"><div class="cal">${cal}</div>
    <div class="legend" style="margin:10px 0 0"><span><i style="background:var(--bad)"></i>Atrasado</span><span><i style="background:var(--warn)"></i>A pagar</span><span><i style="background:var(--info)"></i>A receber</span><span><i style="background:var(--ok)"></i>Quitado</span></div></div>`;
  if (UI.agDia && ymOf(UI.agDia) === M) {
    const es = ev.filter(e => e.data === UI.agDia);
    h += `<div class="sec">${fmtD(UI.agDia)} <button class="mini" data-act="agDia" data-v="">· limpar</button></div><div class="card list">${es.length ? es.map(evRow).join('') : '<div class="empty">Nada neste dia.</div>'}</div>`;
  }
  const atras = allOverdue(inst);

  const prox = upcoming(7, inst);
  h += `<div class="sec">Próximos 7 dias</div><div class="card list">${prox.length ? prox.map(evRow).join('') : '<div class="empty">Nenhum vencimento nos próximos 7 dias.</div>'}</div>`;
  const pend = ev.filter(e => e.v < 0 && ['pendente', 'atrasado'].includes(e.st)), pagas = ev.filter(e => e.v < 0 && e.st === 'pago'), prev = ev.filter(e => e.v > 0);
  h += `<div class="sec">A pagar em ${ymLabel(M)} · ${money(sum(pend, e => -e.v))}</div><div class="card list">${pend.length ? pend.map(evRow).join('') : '<div class="empty">Tudo em dia neste mês.</div>'}</div>`;
  h += `<div class="sec">Receitas do mês · ${money(sum(prev, 'v'))}</div><div class="card list">${prev.length ? prev.map(evRow).join('') : '<div class="empty">Nenhuma receita prevista.</div>'}</div>`;
  h += `<div class="sec">Contas pagas · ${money(sum(pagas, e => -e.v))}</div><div class="card list">${pagas.length ? pagas.map(evRow).join('') : '<div class="empty">Nenhuma conta paga ainda.</div>'}</div>`;
  const recs = [...S.despesas.filter(d => d.rec && d.rec !== 'unica' && !d.proxGerada), ...S.receitas.filter(r => r.rec && r.rec !== 'unica' && !r.proxGerada)];

  h += `<div class="sec">Recorrentes</div><div class="card list">${recs.length ? recs.map(x => {

  }).join('') : '<div class="empty">Marque uma receita ou despesa como semanal, mensal ou anual para ela aparecer aqui.</div>'}</div>`;
  return h;
};

/* Meu carro */
const isFuel = x => /combust/i.test(subLabel(x.cat, x.sub));
function carroRecords(per, veic, inst) {
  const vcats = S.cats.filter(c => c.veiculo).map(c => c.id);
  const t = today();
  const inPer = d => per === 'mes' ? ymOf(d) === M : per === '12m' ? d > addMonthsDate(t, -12) && d <= t : true;
  const out = [];
  S.despesas.forEach(d => { if (vcats.includes(d.cat) && inPer(d.data) && (!veic || d.veiculo === veic)) out.push({...d, origem: 'desp'}); });
  S.compras.forEach(c => { if (vcats.includes(c.cat) && inPer(c.data) && (!veic || c.veiculo === veic)) out.push({...c, origem: 'cartao'}); });
  return out.sort((a, b) => b.data.localeCompare(a.data));
}
VIEWS.carro = function () {
  const per = UI.carroPer, veic = UI.carroVeic;
  const recs = carroRecords(per, veic);
  let h = `<div class="seg"><button class="${per === 'mes' ? 'on' : ''}" data-act="carroPer" data-v="mes">${ymShort(M)}</button><button class="${per === '12m' ? 'on' : ''}" data-act="carroPer" data-v="12m">12 meses</button><button class="${per === 'tudo' ? 'on' : ''}" data-act="carroPer" data-v="tudo">Tudo</button></div>`;
  if (S.cfg.veiculos.length > 1) h += `<select class="search" id="carroVeic"><option value="">Todos os veículos</option>${S.cfg.veiculos.map(v => `<option value="${v.id}" ${veic === v.id ? 'selected' : ''}>${esc(v.nome)}</option>`).join('')}</select>`;
  const total = sum(recs, 'valor');
  // km / consumo — usa todos os registros com km do veículo (dentro do período)
  const kms = recs.filter(x => x.km > 0).map(x => +x.km);
  const rodado = kms.length > 1 ? Math.max(...kms) - Math.min(...kms) : 0;
  const fuel = recs.filter(x => isFuel(x) && x.litros > 0 && x.km > 0).sort((a, b) => a.km - b.km);
  let consumo = 0, precoL = 0;
  if (fuel.length > 1) { const lit = sum(fuel.slice(1), x => +x.litros); consumo = lit ? (fuel[fuel.length - 1].km - fuel[0].km) / lit : 0; }
  const fuelAll = recs.filter(x => isFuel(x) && x.litros > 0); if (fuelAll.length) precoL = sum(fuelAll, 'valor') / sum(fuelAll, x => +x.litros);
  h += `<div class="grid2">
    <div class="kpi"><span>Total gasto</span><b class="num">${money(total)}</b><i>${recs.length} lançamento(s)</i></div>
    <div class="kpi"><span>Combustível</span><b class="num">${money(sum(recs.filter(isFuel), 'valor'))}</b><i>${precoL ? 'Média ' + money(precoL) + '/L' : 'Informe os litros'}</i></div>
    <div class="kpi"><span>Km rodados</span><b class="num">${rodado ? rodado.toLocaleString('pt-BR') + ' km' : '—'}</b><i>Pelo odômetro lançado</i></div>
    <div class="kpi"><span>Custo por km</span><b class="num">${rodado ? money(total / rodado) : '—'}</b><i>${consumo ? 'Consumo ' + consumo.toFixed(1).replace('.', ',') + ' km/L' : 'Consumo: lance km e litros'}</i></div></div>`;
  // por subcategoria
  const map = {};
  recs.forEach(x => { const k = x.cat + '|' + (x.sub || ''); map[k] = (map[k] || 0) + x.valor; });
  const subs = Object.entries(map).sort((a, b) => b[1] - a[1]);
  h += `<div class="card"><h3>Por subcategoria</h3>${subs.length ? subs.map(([k, v]) => { const [c, s] = k.split('|'); return `<div class="cb"><div class="h"><span class="n">${esc(subLabel(c, s) || catLabel(c) + ' (geral)')}</span><b class="num">${money(r2(v))}</b><span class="p">${total ? Math.round(v / total * 100) : 0}%</span></div><div class="bar"><div style="width:${total ? v / total * 100 : 0}%"></div></div></div>`; }).join('') : '<div class="empty">Nenhum gasto com carro no período.</div>'}</div>`;
  const pend = S.despesas.filter(d => S.cats.some(c => c.veiculo && c.id === d.cat) && d.status !== 'pago' && (!veic || d.veiculo === veic)).sort((a, b) => a.data.localeCompare(b.data));
  if (pend.length) h += `<div class="sec">Contas do carro a pagar</div><div class="card list">${pend.map(d => row({check: false, checkAct: 'togglePago', t: d.desc, s: fmtD(d.data) + ' · ' + catFull(d.cat, d.sub), v: money(d.valor), chip: chipSt(stDesp(d)), act: 'editDesp', data: {id: d.id}})).join('')}</div>`;
  h += `<div class="sec">Lançamentos</div><div class="card list">${recs.length ? recs.map(x => row({ic: x.origem === 'cartao' ? '💳' : catIc(x.cat), t: x.desc, s: fmtD(x.data) + ' · ' + (subLabel(x.cat, x.sub) || catLabel(x.cat)) + (x.km ? ' · ' + Number(x.km).toLocaleString('pt-BR') + ' km' : '') + (x.litros ? ' · ' + String(x.litros).replace('.', ',') + ' L' : ''), v: money(x.valor), act: x.origem === 'cartao' ? 'editCompra' : 'editDesp', data: {id: x.id}})).join('') : '<div class="empty">Lance uma despesa na categoria Carro e escolha a subcategoria.</div>'}</div>`;
  h += `<button class="btn full" data-act="newDespCarro">+ Gasto com o carro</button>`;
  return h;
};

/* =========================================================
   Formulários (bottom sheet)
   ========================================================= */
let FORM = null;
function openSheet(html) { $('#sheetBox').innerHTML = html; $('#sheet').classList.add('on'); }
function closeSheet() { $('#sheet').classList.remove('on'); FORM = null; }
function openForm(cfg) { FORM = Object.assign({}, cfg, {v: Object.assign({}, cfg.values || {}), armed: false}); drawForm(); $('#sheet').classList.add('on'); $('#sheetBox').scrollTop = 0; }
function optsHTML(opts, val) {
  let h = '', grp = null;
  for (const o of opts) {
    const [v, l, g] = o;
    if (g !== undefined && g !== grp) { if (grp !== null) h += '</optgroup>'; h += `<optgroup label="${esc(g)}">`; grp = g; }
    h += `<option value="${esc(v)}" ${String(val ?? '') === String(v) ? 'selected' : ''}>${esc(l)}</option>`;
  }
  if (grp !== null) h += '</optgroup>';
  return h;
}
function fieldHTML(fd, i) {
  const v = FORM.v[fd.k], lb = esc(fd.label) + (fd.req ? ' *' : '');
  switch (fd.type) {
    case 'money': return `<label class="fl"><span>${lb}</span><input data-k="${fd.k}" inputmode="decimal" placeholder="0,00" value="${esc(mfmt(v))}"></label>`;
    case 'number': return `<label class="fl"><span>${lb}</span><input data-k="${fd.k}" inputmode="${fd.step === '1' ? 'numeric' : 'decimal'}" placeholder="${fd.ph || ''}" value="${esc(v === '' || v == null ? '' : (fd.step === '1' ? String(v) : String(v).replace('.', ',')))}"></label>`;
    case 'date': return `<label class="fl"><span>${lb}</span><input data-k="${fd.k}" type="date" value="${esc(v || '')}"></label>`;
    case 'textarea': return `<label class="fl"><span>${lb}</span><textarea data-k="${fd.k}" placeholder="${fd.ph || ''}">${esc(v || '')}</textarea></label>`;
    case 'select': { const opts = typeof fd.options === 'function' ? fd.options(FORM.v) : fd.options; return `<label class="fl"><span>${lb}</span><select data-k="${fd.k}" data-redraw="1">${optsHTML(opts, v)}</select></label>`; }
    case 'seg': return `<div class="fl"><span>${lb}</span><div class="seg">${fd.options.map(([k, l]) => `<button type="button" class="${String(v) === String(k) ? 'on' : ''}" data-act="seg" data-k="${fd.k}" data-v="${k}">${l}</button>`).join('')}</div></div>`;
    case 'check': return `<label class="fl ck"><input type="checkbox" data-k="${fd.k}" data-redraw="1" ${v ? 'checked' : ''}><span style="margin:0;font-weight:500;color:var(--ink)">${esc(fd.label)}</span></label>`;
    case 'colors': return `<div class="fl"><span>${lb}</span><div class="colors">${CORES.map(c => `<button type="button" class="${v === c ? 'on' : ''}" style="background:${c}" data-act="seg" data-k="${fd.k}" data-v="${c}"></button>`).join('')}</div></div>`;
    case 'hint': return `<div class="hint">${fd.html}</div>`;
    case 'info': return `<div class="hint" data-info="${i}">${fd.fn(FORM.v)}</div>`;
    case 'html': return fd.fn(FORM.v);
    case 'subs': return `<div class="fl"><span>${lb}</span>${(v || []).map((s, j) => `<div class="subed"><input data-subi="${j}" value="${esc(s.nome)}" placeholder="Nome da subcategoria"><button type="button" data-act="subDel" data-i="${j}">✕</button></div>`).join('')}<button type="button" class="mini" data-act="subAdd">+ Adicionar subcategoria</button></div>`;
    default: return `<label class="fl"><span>${lb}</span><input data-k="${fd.k}" placeholder="${fd.ph || ''}" value="${esc(v ?? '')}"></label>`;
  }
}
function drawForm() {
  const f = FORM;
  let h = `<div class="sh-head"><b>${esc(f.title)}</b><button data-act="closeSheet" aria-label="Fechar">✕</button></div>`;
  f.fields.forEach((fd, i) => { if (!fd.show || fd.show(f.v)) h += fieldHTML(fd, i); });
  if (f.top) h = h.replace('</div>', '</div>' + f.top);
  h += `<div class="btns" style="margin-top:6px">`;
  (f.btns || []).forEach((b, i) => h += `<button class="btn ${b.cls || 'sec2'}" data-act="formBtn" data-i="${i}">${b.label}</button>`);
  h += `</div>`;
  if (f.onSave) h += `<button class="btn full" style="margin-top:10px" data-act="formSave">${f.saveLabel || 'Salvar'}</button>`;
  if (f.onDelete) h += `<button class="btn danger full" style="margin-top:10px" data-act="formDel">${f.armed ? 'Toque de novo para confirmar' : (f.delLabel || 'Excluir')}</button>`;
  if (f.after) h += f.after(f.v);
  const st = $('#sheetBox').scrollTop;
  $('#sheetBox').innerHTML = h;
  $('#sheetBox').scrollTop = st;
}
function readForm() {
  const v = Object.assign({}, FORM.v);
  for (const fd of FORM.fields) {
    if (!fd.k) continue;
    const vis = !fd.show || fd.show(v);
    if (fd.type === 'money') v[fd.k] = pm(v[fd.k]);
    if (fd.type === 'number') v[fd.k] = pn(v[fd.k], fd.step === '1');
    if (typeof v[fd.k] === 'string') v[fd.k] = v[fd.k].trim();
    if (fd.req && vis && (v[fd.k] === '' || v[fd.k] == null || (fd.type === 'money' && !(v[fd.k] > 0)))) { toast('Preencha: ' + fd.label); return null; }
    if (!vis && fd.clearHidden) v[fd.k] = '';
  }
  return v;
}
function commit(msg) { save(); closeSheet(); render(); if (msg) toast(msg); }

}

  const ac = sum(o.aportes, 'valor');
  openForm({
    title: o.nome, values: {}, fields: [{type: 'html', fn: () => `<div class="ring" style="margin-bottom:8px">${progressRing(o.valor ? ac / o.valor : 0)}<div style="flex:1">
      <div class="stat"><span class="ink2">Meta</span><b class="num">${money(o.valor)}</b></div><div class="stat"><span class="ink2">Guardado</span><b class="num">${money(ac)}</b></div>
      <div class="stat"><span class="ink2">Falta</span><b class="num">${money(Math.max(0, o.valor - ac))}</b></div></div></div>
      <div class="sec">Movimentações</div><div class="list">${o.aportes.length ? o.aportes.slice().sort((a, b) => b.data.localeCompare(a.data)).map(a => row({ic: a.valor < 0 ? '↗️' : '↘️', t: (a.valor < 0 ? 'Retirada ' : 'Aporte ') + money(Math.abs(a.valor)), s: fmtD(a.data), v: '<span class="mini">Excluir</span>', act: 'delAporte', data: {id: o.id, pg: a.id}})).join('') : '<div class="empty">Nenhum aporte ainda.</div>'}</div>`}],
    btns: [{label: 'Guardar dinheiro', cls: '', fn: () => formAporte(o, 1)}, {label: 'Retirar', fn: () => formAporte(o, -1)}, {label: 'Editar', fn: () => formObj(o)}]
  });
}
function formAporte(o, sinal) {
  openForm({
    title: (sinal > 0 ? 'Guardar em ' : 'Retirar de ') + o.nome, values: {valor: '', data: today()},
    fields: [{k: 'valor', label: 'Valor', type: 'money', req: true}, {k: 'data', label: 'Data', type: 'date', req: true}],
    onSave: v => { o.aportes.push({id: uid(), valor: r2(v.valor * sinal), data: v.data}); save(); render(); openObj(o.id); toast('Objetivo atualizado'); }
  });
}
/* ---------- Categorias ---------- */
function formCat(c, tipo) {
  const isNew = !c;
  c = c ? JSON.parse(JSON.stringify(c)) : {nome: '', ic: tipo === 'r' ? '💰' : '📦', tipo, grupo: tipo === 'r' ? 'Receitas' : 'Outras', veiculo: false, subs: []};
  openForm({
    title: isNew ? 'Nova categoria' : 'Editar categoria', values: c,
    fields: [{k: 'nome', label: 'Nome', req: true}, {k: 'ic', label: 'Ícone (emoji)', ph: '🚗'},
      {k: 'grupo', label: 'Grupo', type: 'select', options: GRUPOS_D.map(g => [g, g]), show: v => v.tipo === 'd'},
      {k: 'veiculo', label: 'É um veículo (mostra km, litros e entra no relatório do carro)', type: 'check', show: v => v.tipo === 'd'},
      {k: 'subs', label: 'Subcategorias', type: 'subs'}],
    onSave: v => {
      v.subs = (v.subs || []).filter(s => s.nome && s.nome.trim()).map(s => ({id: s.id || uid(), nome: s.nome.trim()}));
      v.veiculo = !!v.veiculo; v.ic = v.ic || '📦';
      if (isNew) { let id = slug(v.nome) || uid(); if (catById(id)) id += '-' + uid().slice(-4); S.cats.push(Object.assign({}, v, {id})); }
      else Object.assign(catById(c.id), v);
      commit(isNew ? 'Categoria criada' : 'Categoria atualizada');
    },
    onDelete: isNew ? null : () => {
      const uso = S.despesas.filter(d => d.cat === c.id).length + S.receitas.filter(r => r.cat === c.id).length + S.compras.filter(x => x.cat === c.id).length;
      if (uso) { toast(`Categoria em uso em ${uso} lançamento(s) — mova-os antes de excluir`); FORM.armed = false; drawForm(); return; }
      S.cats = S.cats.filter(x => x.id !== c.id); commit('Categoria excluída');
    }
  });
}
/* ---------- Veículos / config ---------- */
function formVeic(v) {
  const isNew = !v;
  openForm({
    title: isNew ? 'Novo veículo' : 'Editar veículo', values: v || {nome: ''},
    fields: [{k: 'nome', label: 'Nome / modelo', req: true, ph: 'Ex.: Onix 2020'}],
    onSave: x => { if (isNew) S.cfg.veiculos.push({id: uid(), nome: x.nome}); else S.cfg.veiculos.find(y => y.id === v.id).nome = x.nome; commit('Veículo salvo'); },
    onDelete: isNew || S.cfg.veiculos.length < 2 ? null : () => { S.cfg.veiculos = S.cfg.veiculos.filter(y => y.id !== v.id); commit('Veículo excluído'); }
  });
}
function monthPicker() {
  let y = +M.slice(0, 4);
  const draw = () => openSheet(`<div class="sh-head"><b>Escolher mês</b><button data-act="closeSheet">✕</button></div>
    <div style="display:flex;align-items:center;justify-content:center;gap:20px;font-size:18px;font-weight:650"><button class="btn sec2" data-act="pickY" data-v="-1">‹</button><span>${y}</span><button class="btn sec2" data-act="pickY" data-v="1">›</button></div>
    <div class="mgrid">${MES3.map((m, i) => { const ym = y + '-' + pad(i + 1); return `<button class="${ym === M ? 'on' : ''}" data-act="pickM" data-v="${ym}">${m}</button>`; }).join('')}</div>
    <button class="btn sec2 full" data-act="pickM" data-v="${ymOf(today())}">Mês atual</button>`);
  monthPicker.y = d => { y += d; draw(); };
  draw();
}

/* =========================================================
   Backup
   ========================================================= */
function exportar() {
  const name = 'financas-backup-' + today() + '.json', txt = JSON.stringify(S, null, 1);
  if (window.Android && Android.saveFile) { Android.saveFile(name, txt); return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([txt], {type: 'application/json'})); a.download = name; document.body.appendChild(a); a.click(); a.remove();
  toast('Backup exportado');
}
$('#fileIn').addEventListener('change', e => {
  const f = e.target.files[0]; if (!f) return;
  const rd = new FileReader();
  rd.onload = () => {
    try { const d = JSON.parse(rd.result); if (!d || !d.cats || !d.cfg) throw 0; S = normalize(d); save(); VS = []; V = {name: 'inicio'}; render(); toast('Backup importado'); }
    catch (err) { toast('Arquivo inválido'); }
    e.target.value = '';
  };
  rd.readAsText(f);
});

/* =========================================================
   Ações
   ========================================================= */
const ACT = {
  tab: d => go(d.v), go: d => go(d.v), back: () => window.appBack(),
  mPrev: () => { M = addMonthsYM(M, -1); UI.agDia = ''; render(); }, mNext: () => { M = addMonthsYM(M, 1); UI.agDia = ''; render(); },
  mPick: () => monthPicker(), pickY: d => monthPicker.y(+d.v), pickM: d => { M = d.v; UI.agDia = ''; closeSheet(); render(); },
  toggleHide: () => { S.cfg.ocultar = !S.cfg.ocultar; save(); render(); },
  closeSheet: () => closeSheet(),
  fab: () => openSheet(`<div class="sh-head"><b>Novo lançamento</b><button data-act="closeSheet">✕</button></div><div class="list menu">
      ${row({ic: '🔻', t: 'Despesa', s: 'Conta, compra à vista, boleto…', v: '', act: 'fabDo', data: {v: 'd'}})}
      ${row({ic: '🔺', t: 'Receita', s: 'Salário, renda extra, freela…', v: '', act: 'fabDo', data: {v: 'r'}})}
      ${row({ic: '🚗', t: 'Gasto com o carro', s: 'Combustível, manutenção, IPVA…', v: '', act: 'fabDo', data: {v: 'carro'}})}
      ${row({ic: '💳', t: 'Compra no cartão', s: 'À vista ou parcelada', v: '', act: 'fabDo', data: {v: 'cc'}})}</div>`),
  fabDo: d => { if (d.v === 'd') formDesp(); else if (d.v === 'r') formRec(); else if (d.v === 'carro') ACT.newDespCarro(); else formCompra(null, V.name === 'cartao' ? V.param : null); },
  newDespCarro: () => { const c = S.cats.find(x => x.veiculo); formDesp(null, c ? {cat: c.id, forma: 'Pix', veiculo: UI.carroVeic || S.cfg.veiculos[0].id} : {}); },
  lancTipo: d => { UI.lancTipo = d.v; UI.lancCat = ''; render(); },
  editDesp: d => { const x = S.despesas.find(y => y.id === d.id); if (x) formDesp(x); },
  editRec: d => { const x = S.receitas.find(y => y.id === d.id); if (x) formRec(x); },
  togglePago: (d, el, e) => { e.stopPropagation(); const x = S.despesas.find(y => y.id === d.id); if (!x) return; if (x.status === 'pago') { x.status = 'pendente'; delete x.pagoEm; toast('Marcada como pendente'); } else { marcarPago(x); toast('Paga ✓' + (x.rec && x.rec !== 'unica' ? ' — próxima criada' : '')); } save(); render(); },
  toggleRec: (d, el, e) => { e.stopPropagation(); const x = S.receitas.find(y => y.id === d.id); if (!x) return; if (x.status === 'recebida') { x.status = 'pendente'; delete x.recEm; } else { marcarRecebida(x); toast('Recebida ✓'); } save(); render(); },
  agDia: d => { UI.agDia = d.v; render(); },
  expCat: d => { UI.exp[d.v] = !UI.exp[d.v]; render(); },
  tbl: d => { UI.tbl[d.v] = !UI.tbl[d.v]; render(); },
  newCard: () => formCard(), editCard: d => formCard(S.cartoes.find(x => x.id === d.id)),
  openCard: d => { if (!S.cartoes.find(x => x.id === d.id)) return; go('cartao', d.id); },
  setMonthCard: d => { M = d.v; render(); window.scrollTo(0, 0); },
  newCompra: d => formCompra(null, d.id), editCompra: d => { const x = S.compras.find(y => y.id === d.id); if (x) formCompra(x); },
  payFatura: d => formPgFatura(d.id), editPgFat: d => { const p = S.faturasPg.find(x => x.id === d.id); if (p) formPgFatura(p.cartao, p); },
  resMov: d => formResMov(d.v), resCfg: () => formResCfg(), editResMov: d => { const m = S.reserva.movs.find(x => x.id === d.id); if (m) formResMov(m.tipo, m); },
  usarMedia: d => { FORM.v.custoMensal = +d.v; drawForm(); },
  empTab: d => { UI.empTab = d.v; render(); },
  newLoan: () => formLoan(), openLoan: d => { if (S.tomados.find(x => x.id === d.id)) openLoan(d.id); else go('emprestimos'); },
  delLoanPg: d => { const l = S.tomados.find(x => x.id === d.id); l.pagos = l.pagos.filter(p => p.id !== d.pg); save(); render(); openLoan(l.id); toast('Pagamento excluído'); },
  newConc: () => formConc(), openConc: d => openConc(d.id),
  delConcRec: d => { const c = S.concedidos.find(x => x.id === d.id); c.recebs = c.recebs.filter(p => p.id !== d.pg); save(); render(); openConc(c.id); },
  newObj: () => formObj(), openObj: d => openObj(d.id),
  delAporte: d => { const o = S.objetivos.find(x => x.id === d.id); o.aportes = o.aportes.filter(p => p.id !== d.pg); save(); render(); openObj(o.id); },
  carroPer: d => { UI.carroPer = d.v; render(); },
  newCat: d => formCat(null, d.v), editCat: d => formCat(catById(d.id)),
  subAdd: () => { FORM.v.subs = [...(FORM.v.subs || []), {id: '', nome: ''}]; drawForm(); const ins = $('#sheetBox').querySelectorAll('[data-subi]'); ins[ins.length - 1].focus(); },
  subDel: d => { FORM.v.subs.splice(+d.i, 1); drawForm(); },
  cfgSaldo: () => openForm({title: 'Saldo inicial', values: {s: S.cfg.saldoInicial}, fields: [{k: 's', label: 'Saldo inicial da conta', type: 'money'}], onSave: v => { S.cfg.saldoInicial = v.s; commit('Saldo inicial salvo'); }}),
  newVeic: () => formVeic(), editVeic: d => formVeic(S.cfg.veiculos.find(x => x.id === d.id)),
  tema: d => { S.cfg.tema = d.v; save(); render(); },
  exportar: () => exportar(), importar: () => $('#fileIn').click(),
  resetAll: () => openForm({title: 'Apagar todos os dados?', values: {}, fields: [{type: 'hint', html: 'Isso remove receitas, despesas, cartões, empréstimos, reserva e objetivos deste aparelho. Exporte um backup antes se quiser guardar.'}], onDelete: () => { S = seed(); VS = []; V = {name: 'inicio'}; commit('Dados apagados'); }, delLabel: 'Apagar tudo'}),
  seg: d => { FORM.v[d.k] = d.v; drawForm(); },
  formSave: () => { const v = readForm(); if (!v) return; FORM.onSave(v); },
  formDel: () => { if (!FORM.armed) { FORM.armed = true; drawForm(); return; } FORM.onDelete(); },
  formBtn: d => FORM.btns[+d.i].fn()
};
document.addEventListener('click', e => {
  const tipEl = e.target.closest('[data-tip]'); if (tipEl) { showTip(tipEl); return; }
  const el = e.target.closest('[data-act]'); if (!el) return;
  const a = el.dataset.act; if (ACT[a]) ACT[a](el.dataset, el, e);
});
document.addEventListener('pointerover', e => { const el = e.target.closest && e.target.closest('[data-tip]'); if (el && e.pointerType === 'mouse') showTip(el); });
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'lancQ') { UI.lancQ = t.value; $('#lancList').innerHTML = lancList(); return; }
  if (!FORM) return;
  if (t.dataset.subi !== undefined) { FORM.v.subs[+t.dataset.subi].nome = t.value; return; }
  const k = t.dataset.k; if (!k) return;
  FORM.v[k] = t.type === 'checkbox' ? t.checked : t.value;
  document.querySelectorAll('[data-info]').forEach(el => el.innerHTML = FORM.fields[+el.dataset.info].fn(FORM.v));
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'lancCat') { UI.lancCat = t.value; $('#lancList').innerHTML = lancList(); return; }
  if (t.id === 'carroVeic') { UI.carroVeic = t.value; render(); return; }
  if (!FORM || !t.dataset.k) return;
  FORM.v[t.dataset.k] = t.type === 'checkbox' ? t.checked : t.value;
  const fd = FORM.fields.find(f => f.k === t.dataset.k);
  if (fd && fd.onChange) fd.onChange(FORM.v);
  if (t.dataset.redraw || t.type === 'date') drawForm();
});
matchMedia('(prefers-color-scheme: dark)').addEventListener && matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => S.cfg.tema === 'auto' && render());
render();
</script>
</body>
</html>
